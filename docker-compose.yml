name: airlock-local
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: airlock
      POSTGRES_USER: airlock
      POSTGRES_PASSWORD: ${AIRLOCK_DB_PASSWORD:?Run scripts/setup.sh first}
    ports:
      - "127.0.0.1:${AIRLOCK_DB_PORT:-55433}:5432"
    volumes:
      - airlock-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airlock -d airlock"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  airlock-data:
