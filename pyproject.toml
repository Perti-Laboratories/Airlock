[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-local"
version = "0.8.0"
description = "Local single-domain chat and curated memory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1", "pydantic-settings>=2.6,<3",
  "cryptography>=48,<49", "httpx>=0.27,<1", "alembic>=1.14,<2", "python-dateutil>=2.9,<3", "keyring>=25,<26", "airlock-local-core==0.2.0", "pypdf==6.21.2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
airlock = "airlock.cli:main"
airlock-connector = "airlock_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airlock = ["static/*", "google_desktop_client.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
