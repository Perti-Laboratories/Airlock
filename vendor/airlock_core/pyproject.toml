[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-local-core"
version = "0.2.0"
description = "Explicitly configured memory and local model services shared by connected planner and Airlock."
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0.36,<3"]

[tool.setuptools.packages.find]
where = ["src"]
