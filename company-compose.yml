name: airlock-company-demo
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: airlock_company_demo
      POSTGRES_USER: company_demo
      POSTGRES_PASSWORD: ${COMPANY_DEMO_DB_PASSWORD:?Run scripts/company_demo.py start}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - company-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_demo -d airlock_company_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  company-data:
